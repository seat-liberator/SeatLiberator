logging:
  level:
    com.seatliberator.seatliberator.jwks: debug
    com.seatliberator.seatliberator.identity: debug
    com.seatliberator.seatliberator: debug

identity:
  validate:
    jwt:
      enabled: true
      jwks-server:
        base-url: ${JWKS_BASE_URL:http://localhost:9090}
        uri: /.well-known/jwks.json

server:
  port: ${PORT:8080}

spring:

  application:
    name: notification-application

  datasource:
    url: ${DB_URL:jdbc:h2:mem:${spring.application.name};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: create-drop