logging:
  level:
    com.seatliberator.seatliberator.eventrelay: debug
    com.seatliberator.seatliberator.reservation: debug

identity:
  validate:
    jwt:
      enabled: true
      jwks-server:
        base-url: ${LOCAL_JWKS_BASE_URL:http://localhost:9090}
        uri: /.well-known/jwks.json

app:
  seed:
    enabled: true

spring:
  datasource:
    url: ${LOCAL_DB_URL:jdbc:h2:mem:${spring.application.name};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${LOCAL_DB_USERNAME:sa}
    password: ${LOCAL_DB_PASSWORD:}

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: ${LOCAL_DB_DIALECT:${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}}
