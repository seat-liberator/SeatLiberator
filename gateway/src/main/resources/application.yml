server:
  port: 8080

spring:
  application:
    name: gateway-service
  main:
    web-application-type: reactive

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-authentication
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**,/api/v1/oauth2/**,/api/v1/users/**,/api/v1/roles/**,/api/v1/accounts/**

            - id: identity-oauth2-authentication
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/login/**

            - id: identity-jwks
              uri: http://localhost:8081
              predicates:
                - Path=/.well-known/jwks.json

            - id: reservation-service-route
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/reservations/**,/api/v1/rooms/**,/api/v1/booking/**,/api/v1/waitlist/**

            - id: board-service-route
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/board/**

            - id: notification-service-route
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/notification/**
              filters:
                - RewritePath=/api/v1/?(?<segment>.*), /$\{segment}
